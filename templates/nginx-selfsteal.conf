# Создано install.sh. Обычный сайт: TLS завершает Xray на TCP-порту Vision
# и передаёт сюда всё, что не является VLESS. Настоящий IP приходит в PROXY protocol.

# HTTP/1.1
server {
    listen unix:__SOCKET_H1__ proxy_protocol;
    server_name __DOMAIN__;
    include snippets/selfsteal-site.conf;
}

# HTTP/2 без шифрования (h2c), сюда Xray отправляет клиентов с ALPN h2
server {
    __LISTEN_H2__
    server_name __DOMAIN__;
    include snippets/selfsteal-site.conf;
__XHTTP_LOCATION__
}

# TCP 80: выпуск сертификата и переход на HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
    }

    location / {
        return 301 https://__DOMAIN____TLS_PORT_SUFFIX__$request_uri;
    }
}
