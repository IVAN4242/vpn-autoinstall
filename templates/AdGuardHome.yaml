# Создано install.sh. После первого запуска файлом управляет AdGuard Home.
# ratelimit не включайте: все запросы Xray приходят с 127.0.0.1, и лимит на подсеть
# становится одним лимитом на всех пользователей, из-за чего VPN начинает тормозить.
http:
  address: 127.0.0.1:3000
  session_ttl: 30d
users:
  - name: admin
    password: '__ADMIN_HASH__'
auth_attempts: 5
block_auth_min: 15
language: ru
theme: dark
dns:
  bind_hosts:
    - 127.0.0.1
  port: 53
  ratelimit: 0
  refuse_any: true
  upstream_dns:
    - 1.1.1.1
    - 8.8.8.8
    - 1.0.0.1
    - 8.8.4.4
  bootstrap_dns:
    - 8.8.8.8
  fallback_dns:
    - 1.1.1.1
  upstream_mode: parallel
  upstream_timeout: 2s
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_enabled: true
  cache_size: 16777216
  cache_optimistic: true
  cache_optimistic_answer_ttl: 30s
  cache_optimistic_max_age: 12h
  enable_dnssec: false
  max_goroutines: 2000
  use_private_ptr_resolvers: false
tls:
  enabled: false
querylog:
  interval: 1d
  size_memory: 1000
  enabled: true
  file_enabled: false
statistics:
  interval: 1d
  enabled: true
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: true
    url: https://big.oisd.nl/
    name: OISD
    id: 2
whitelist_filters: []
user_rules: []
filtering:
__REWRITES_BLOCK__
  filters_update_interval: 24
  blocked_response_ttl: 10
  filtering_enabled: true
  rewrites_enabled: true
  protection_enabled: true
schema_version: 34
