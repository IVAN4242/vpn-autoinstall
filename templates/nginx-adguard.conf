# Создано install.sh. Панель AdGuard Home: https://__DOMAIN__:__ADGUARD_PORT__/ -> 127.0.0.1:3000
limit_req_zone $binary_remote_addr zone=adguard_login:1m rate=6r/m;

server {
    __LISTEN_ADGUARD__
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     __CERT_FILE__;
    ssl_certificate_key __KEY_FILE__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:adguard_ssl:1m;

    # Сканеры обращаются по голому IP: соединение просто обрывается
    if ($host != "__DOMAIN__") { return 444; }

    access_log /var/log/nginx/adguard-panel.access.log;
    error_log  /var/log/nginx/adguard-panel.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 2m;

    location = /control/login {
        limit_req zone=adguard_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include snippets/adguard-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/adguard-proxy.conf;
    }
}
